<body>
     <!-- Q1 -->
    <h1>Checked Student Result</h1>

    <input type="text" id="marks" placeholder="Enter Your marks">
    <button id="btn">Check Result</button>
    
    <!-- Q2 -->
   <h2>Random Number Generator</h2>

    <label for="userInput">Enter a number:</label>
    <input type="number" id="userInput" placeholder="Enter number">

    <button id="generateBtn">Generate Number</button>

    <p id="result">Your result will appear here.</p>
    <!-- Q3 -->
      <h1>Product Bill Calculator</h1>

    <h3>Product: T-Shirt</h3>
    <p>Price: Rs. 250</p>

    <label>Enter Quantity:</label>
    <input type="number" id="quantity" placeholder="Enter quantity">

    <button id="calculateBtn">Calculate</button>

    <p id="message"></p>

    <script src="app.js"></script>
</body>
